[project]
name = "dpe-dvf"
version = "0.1.0"
description = "Package for data plateform based on France DPE and DVF data"
readme = "README.md"
authors = [
    { name = "Bienvenu NATCHIA", email = "bna.learner@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.111",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dashboard = [
    "streamlit>=1.65.0",
]
dev = [
    "botocore[crt]>=1.43.111",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[project.scripts]
dpe-ingestion = "dpe_dvf.ingestion.cli:main"
dpe-silver = "dpe_dvf.transformation.silver:main"
dpe-gold = "dpe_dvf.transformation.gold:main"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
